[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qportfolio"
version = "0.1.0"
description = "Research library for classical and quantum multi-objective portfolio optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",  # for Parquet cache
    "pymoo>=0.6",
    "tqdm>=4.60",
    "qiskit>=1.2",
    "qiskit-aer>=0.14",
    "juliacall>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qportfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit network or disk (deselect with -m 'not integration')",
    "slow: marks tests that are computationally expensive",
    "quantum: marks tests requiring qiskit",
    "julia: marks tests requiring a Julia installation",
]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # Forward-reference return annotations use # type: ignore[name-defined];
    # ruff F821 fires on them even though they are intentional.
    "F821",
]

[tool.ruff.lint.per-file-ignores]
# Test files may use assert statements and slightly wider lines
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
